<div class="admin-main">
  <div class="white-card shadow-lg">
    <div class="stepper-wrapper">
      <div class="step" [class.active]="currentStep >= 1" [class.completed]="currentStep > 1">
        <div class="step-icon"><i class="fa-solid fa-user"></i></div>
        <span class="step-label">Profil</span>
      </div>
      <div class="line"></div>
      <div class="step" [class.active]="currentStep >= 2" [class.completed]="currentStep > 2">
        <div class="step-icon"><i class="fa-solid fa-building"></i></div>
        <span class="step-label">Entreprise</span>
      </div>
      <div class="line"></div>
      <div class="step" [class.active]="currentStep === 3">
        <div class="step-icon"><i class="fa-solid fa-file-invoice-dollar"></i></div>
        <span class="step-label">Crédit</span>
      </div>
    </div>

    <form [formGroup]="creditForm" (ngSubmit)="onSubmit()">
      
      <div *ngIf="currentStep === 1" class="step-content animate-in">
        <h4 class="section-title">Informations Personnelles</h4>
        <div class="row">
          <div class="col-md-6 form-group"><label>Nom</label><input formControlName="nom" class="form-input"></div>
          <div class="col-md-6 form-group"><label>Prénom</label><input formControlName="prenom" class="form-input"></div>
          
          <div class="col-md-6 form-group mt-3">
            <label>Genre</label>
            <select formControlName="genre" class="form-input">
              <option value="Homme">Homme</option>
              <option value="Femme">Femme</option>
            </select>
          </div>
          <div class="col-md-6 form-group mt-3"><label>Date de Naissance</label><input type="date" formControlName="dateNaissance" class="form-input"></div>

          <div class="col-md-12 form-group mt-3">
            <label>État Civil</label>
            <select formControlName="situationFamiliale" class="form-input">
              <option value="celibataire">Célibataire</option>
              <option value="marie">Marié(e)</option>
              <option value="divorce">Divorcé(e)</option>
            </select>
          </div>

          <div class="col-md-12 form-group mt-3" *ngIf="creditForm.get('situationFamiliale')?.value === 'divorce'">
            <label>Pension Alimentaire (TND)</label>
            <input type="number" formControlName="pensionAlimentaire" class="form-input" 
                   [placeholder]="creditForm.get('genre')?.value === 'Homme' ? 'Montant à déduire du salaire (-)' : 'Montant à ajouter au salaire (+)'">
          </div>

          <div class="col-md-12 form-group mt-3" *ngIf="creditForm.get('situationFamiliale')?.value === 'marie'">
            <label>Nombre d'enfants</label>
            <input type="number" formControlName="nbEnfants" class="form-input" (input)="onNbEnfantsChange()">
            
            <div class="row mt-2" *ngFor="let child of datesNaissanceEnfants.controls; let i = index">
              <div class="col-md-6 mt-2">
                <label>Date de naissance Enfant {{i+1}}</label>
                <input [formControl]="$any(child)" type="date" class="form-input">
              </div>
            </div>
          </div>
        </div>
      </div>

      <div *ngIf="currentStep === 2" class="step-content animate-in">
        <h4 class="section-title">Situation Professionnelle</h4>
        <div class="row">
          <div class="col-md-6 form-group"><label>Nom de l'Entreprise</label><input formControlName="nomEntreprise" class="form-input"></div>
          <div class="col-md-6 form-group"><label>Matricule Fiscale</label><input formControlName="matriculeFiscale" class="form-input"></div>
          
          <div class="col-md-6 form-group mt-3">
            <label>Type de Contrat</label>
            <select formControlName="typeContrat" class="form-input">
              <option value="Titulaire">Titulaire</option>
              <option value="CDI">CDI</option>
              <option value="CDD">CDD</option>
              <option value="CVP1">CVP 1</option>
              <option value="CVP2">CVP 2</option>
            </select>
          </div>

          <div class="row mt-3" *ngIf="creditForm.get('typeContrat')?.value !== 'CDI'">
            <div class="col-md-3 form-group"><label>Durée (mois)</label><input type="number" formControlName="dureeContratMois" class="form-input"></div>
            <div class="col-md-3 form-group"><label>Essai (mois)</label><input type="number" formControlName="periodeEssaiMois" class="form-input"></div>
            <div class="col-md-3 form-group"><label>Mois travaillés</label><input type="number" formControlName="moisTravailles" class="form-input"></div>
            <div class="col-md-3 form-group"><label>Mois restants</label><input type="number" formControlName="moisRestants" class="form-input"></div>
          </div>

          <div class="col-md-6 form-group mt-3"><label>Poste / Profession</label><input formControlName="professionDetail" class="form-input"></div>
          <div class="col-md-6 form-group mt-3"><label>Date d'embauche</label><input type="date" formControlName="dateEmbauche" class="form-input"></div>
        </div>
      </div>

      <!-- ÉTAPE 3 -->
      <div *ngIf="currentStep === 3" class="step-content animate-in">
        <h4 class="section-title">Informations sur le Crédit</h4>
        <div class="row">
          <div class="col-md-6 form-group"><label>Montant souhaité (TND)</label><input type="number" formControlName="montant" class="form-input"></div>
          <div class="col-md-6 form-group"><label>Durée (Années)</label><input type="number" formControlName="duree" class="form-input"></div>
          <div class="col-md-6 form-group mt-3"><label>Revenu Mensuel Net</label><input type="number" formControlName="revenuMensuel" class="form-input"></div>
          <div class="col-md-6 form-group mt-3"><label>Charges Fixes</label><input type="number" formControlName="chargesFixes" class="form-input"></div>
        </div>

        <div class="col-md-12 mt-4">
          <h5 class="subsection-title">Garantie proposée</h5>
          <div class="row">
            <div class="col-md-6 form-group">
              <label>Type de Garantie</label>
              <select formControlName="typeGarantie" class="form-input">
                <option value="Hypothèque">Hypothèque (Immobilier)</option>
                <option value="Caution">Caution (Personne physique)</option>
                <option value="Gage">Gage (Véhicule/Matériel)</option>
                <option value="Nantie">Placement bloqué</option>
                <option value="Aucune">Sans garantie</option>
              </select>
            </div>
            <div class="col-md-6 form-group">
              <label>Valeur estimée de la garantie (TND)</label>
              <input type="number" formControlName="valeurGarantie" class="form-input" placeholder="Ex: 50000">
            </div>
          </div>
        </div>

        <!-- Section Uploads -->
        <div class="upload-container mt-4">
          <label class="upload-title">📑 carte d'indentité nationale (PDF)</label>
          <input type="file" (change)="onFileSelected($event, 'CIN')" hidden id="fileUploadCIN" multiple accept="application/pdf">
          <label for="fileUploadCIN" class="custom-file-upload">Choisir les fichiers</label>
          <div *ngFor="let file of selectedCinFiles; let i = index" class="mt-2">
            {{file.name}} <button (click)="removeFile(i, 'CIN')" type="button" class="btn-danger btn-sm">X</button>
          </div>
        </div>

        <div class="upload-container mt-4">
          <label class="upload-title">📑 attestation de travail (PDF)</label>
          <input type="file" (change)="onFileSelected($event, 'ATTEST')" hidden id="fileUploadAttest" multiple accept="application/pdf">
          <label for="fileUploadAttest" class="custom-file-upload">Choisir les fichiers</label>
          <div *ngFor="let file of selectedAttestFiles; let i = index" class="mt-2">
            {{file.name}} <button (click)="removeFile(i, 'ATTEST')" type="button" class="btn-danger btn-sm">X</button>
          </div>
        </div>

        <div class="upload-container mt-4">
          <label class="upload-title">📑 Fiches de paie de la dernière année (PDF)</label>
          <input type="file" (change)="onFileSelected($event, 'PAIE')" hidden id="fichePaieUpload" multiple accept="application/pdf">
          <label for="fichePaieUpload" class="custom-file-upload">Choisir les fichiers</label>
          <div *ngFor="let file of selectedPaieFiles; let i = index" class="mt-2">
            {{file.name}} <button (click)="removeFile(i, 'PAIE')" type="button" class="btn-danger btn-sm">X</button>
          </div>
        </div>
      </div> <!-- /!\ C'EST CE DIV QUI MANQUAIT /!\ -->

    <div class="footer-actions mt-5">
        <button type="button" class="btn-secondary" (click)="prevStep()" *ngIf="currentStep > 1">Retour</button>
        <button type="button" class="btn-primary" (click)="nextStep()" *ngIf="currentStep < 3">Suivant</button>
        <button type="submit" class="btn-analyze" *ngIf="currentStep === 3" [disabled]="creditForm.invalid">Envoyer la demande</button>
      </div>
    </form>
  </div>
</div>
